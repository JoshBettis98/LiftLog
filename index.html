<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light}[hidden]{display:none!important}</style>
<title>LiftLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first app shell. Sticky large title, stacked list panels, fixed bottom tab bar; a workout runs as a full-screen layer with a rest bar pinned to the bottom. Completed sets fill in like a loaded bumper plate. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#12161C; --muted:#586170; --line:#D3D9E1;
  --accent:#1B58C2; --accent-ink:#FFFFFF; --accent-soft:#DDE7F8;
  --good:#1F8048; --warn:#C08A0B; --bad:#C2283A; --on-bad:#FFFFFF; --knob:#FFFFFF; --scrim:rgba(12,15,20,.45);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-card:14px; --r-ctl:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#191E26; --surface-2:#222833; --ink:#E8EBF0; --muted:#97A1B0; --line:#2B323E;
  --accent:#4B8DF2; --accent-ink:#06101F; --accent-soft:#1B2A44;
  --good:#3DBA6E; --warn:#E4B32F; --bad:#F0566A; --on-bad:#1A0508; --knob:#F4F6F9; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191E26; --surface-2:#222833; --ink:#E8EBF0; --muted:#97A1B0; --line:#2B323E;
  --accent:#4B8DF2; --accent-ink:#06101F; --accent-soft:#1B2A44;
  --good:#3DBA6E; --warn:#E4B32F; --bad:#F0566A; --on-bad:#1A0508; --knob:#F4F6F9; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* App shell: the document never scrolls. #scroll is the only scrolling area and the tab bar sits below it in normal flow,
   so iOS Home Screen mode can't shift a fixed bar when page heights change. */
/* --app-h is set from the real screen height in Home Screen mode, where iOS reports a viewport that is short by the status bar. */
html{height:var(--app-h,100%);box-sizing:border-box;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font-ui);margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font:800 32px/1.05 var(--font-num);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
section{margin-top:24px}
h2{font:600 15px/1.2 var(--font-ui);color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
p{margin:6px 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;width:100%;text-align:left;background:var(--surface)}
.rows > * + *{border-top:1px solid var(--line)}
.row.add{color:var(--accent);font-weight:600;gap:8px}
.row.add svg{width:20px;height:20px}
.row:disabled{opacity:1;color:var(--muted)}

/* Swipe-to-reveal actions */
.swipe{position:relative;overflow:hidden}
.swipe-act{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.swipe.show > .swipe-act{visibility:visible}
.swipe-act button{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px}
.swipe-act svg{width:22px;height:22px}
.swipe-act .rep{background:var(--accent);color:var(--accent-ink)}
.swipe-act .del{background:var(--bad);color:var(--on-bad)}
.swipe-c{position:relative;background:var(--surface);transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.swipe-c.dragging{transition:none}
.hint{color:var(--muted);font-size:14px;margin:8px 2px 0}
.row.col{flex-direction:column;align-items:stretch;gap:8px;padding-block:12px}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.chev{color:var(--muted);width:18px;height:18px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:var(--r-ctl);font-weight:600;background:var(--surface);border:1px solid var(--line);width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;min-height:54px;font-size:17px}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;width:auto;padding:0 14px;font-size:15px}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.link{color:var(--accent);font-weight:600;min-height:40px;padding:0 2px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:20px;height:20px}
.actions{display:grid;gap:10px;margin-top:14px}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.ibtn svg{width:22px;height:22px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.ord{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:12px;font-weight:800;margin-right:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--scrim)}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.optrow + .optrow{margin-top:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:20px;line-height:1}
.stepper .num{min-width:5.5ch;text-align:center;font-weight:700}
.rctl{display:flex;gap:10px;flex-wrap:wrap}
.rhead{display:flex;align-items:center;gap:2px}

.rec{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.rec .lbl{display:flex;justify-content:space-between;gap:6px;font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px var(--scrim);transition:transform .2s}
.switch:checked{background:var(--good)}
.switch:checked::after{transform:translateX(20px)}

.intro .name{font:800 20px/1.2 var(--font-num)}
.pform{display:grid;gap:14px;margin-top:12px}
.pform .optrow + .optrow{margin-top:0}
.bwbox{display:flex;align-items:center;gap:8px}
.bwbox .field{width:96px;text-align:center;font-weight:700}
.est{color:var(--muted);font-weight:600}
details.help{margin-top:10px}
details.help summary{font-weight:600;color:var(--accent);cursor:pointer;min-height:32px}
details.help ol{padding-left:20px;margin:8px 0}
details.help li{margin:6px 0}
.empty{text-align:center;padding:28px 16px}

/* Workout layer */
.wo{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);z-index:20;background:var(--bg);display:flex;flex-direction:column}
.wo-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:24px}
.wo-inner{max-width:560px;margin:0 auto}
.wo-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 8px}
.wo-title{font:800 24px/1.1 var(--font-num)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-top:12px}
.card > .swipe-c{padding:12px 14px 6px}
.wtimer{display:flex;align-items:center;gap:2px}
.wtimer .clockS{font:800 22px/1 var(--font-num);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.wtimer.paused .clockS{color:var(--muted)}
.wtimer .ibtn{color:var(--ink)}
.wtimer .wait{font-size:13px;color:var(--muted);max-width:9em;text-align:right;line-height:1.2}
.pick-head{position:sticky;top:-18px;z-index:1;background:var(--surface);padding-block:2px 6px;margin-top:-2px}
.card-h{display:flex;align-items:flex-start;gap:6px}
.card-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:2px 0;min-height:44px;justify-content:center}
.card-t .name{display:inline-flex;align-items:center;gap:6px}
.donechk{display:inline-flex;color:var(--good)}
.donechk svg{width:18px;height:18px}
.card > .swipe-c:has(.card-t[aria-expanded="false"]){padding-bottom:12px}
.ss{margin-top:14px;padding:10px 10px 12px;border:1.5px dashed var(--accent);border-radius:calc(var(--r-card) + 4px)}
.ss-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 4px}
.ss-tag{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:15px}
.ss-tag svg{width:17px;height:17px}
.ss .card{margin-top:8px}
.footl{display:flex;gap:10px;align-items:center}
.calc-w{margin-top:6px}
.calc-out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px}
.calc-out svg{display:block;margin-top:8px}
.calc-out .sleeve{fill:var(--muted);fill-opacity:.5}
.calc-out .collar{fill:var(--muted)}
.calc-out .plt{stroke:var(--ink);stroke-opacity:.25;stroke-width:1}
.set.head span:nth-child(2){white-space:nowrap}
.bodymap{width:168px;flex:none}
.bodymap .bd{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2}
.bodymap .mo{fill:var(--muted);fill-opacity:.28}
.bodymap .mp{fill:var(--accent)}
.bodymap .ms{fill:var(--accent);fill-opacity:.38}
.bodymap .bl{fill:var(--muted);font:11px var(--font-ui)}
.det-map{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:10px}
.det-legend{display:grid;gap:8px;font-size:15px;min-width:0}
.det-legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--accent)}
.det-legend .sw.ms{opacity:.38}
.steps{margin:0;padding-left:22px;display:grid;gap:10px}
.steps li{line-height:1.45}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
a.btn{text-decoration:none;color:var(--ink)}
.pickrow{padding:0 4px 0 0}
.pickbtn{text-align:left;padding:10px 14px;min-height:54px}
.pickbtn:disabled .name{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-top:18px}
.stats > div{background:var(--surface);padding:12px 14px}
.stats .big{margin-top:4px}
.sum{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sum-h{display:flex;align-items:center;gap:14px}
.badge{width:52px;height:52px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.badge svg{width:28px;height:28px;stroke-width:3}
.prico{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--warn);display:grid;place-items:center}
.prico svg{width:22px;height:22px}
.row.pr{animation:rise .45s ease both;animation-delay:calc(.35s + var(--d,0) * .12s)}
.row .right{text-align:right}
.confetti{position:fixed;top:0;left:0;width:100%;height:var(--app-h,100%);pointer-events:none;z-index:50}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#sum{z-index:25}
.clock.small{font-size:22px;line-height:1.15}
.thumbs{display:flex;flex:none}
.thumb{width:40px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.thumb svg{width:21px;height:21px}
.thumb.up[aria-pressed="true"]{color:var(--accent)}
.thumb.down[aria-pressed="true"]{color:var(--bad)}
.thumb[aria-pressed="true"] svg path{fill:currentColor}
.liked{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--accent)}
.liked svg{width:15px;height:15px}
.liked svg path{fill:currentColor}
.tgt{color:var(--accent);font-weight:600;font-size:15px;margin-top:2px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 46px;align-items:center;gap:8px;margin-top:8px}
.set.head{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
.setw{margin-top:8px;border-radius:10px}
.setw .set{margin-top:0;padding-block:1px}
.set.warm input{height:42px;font-size:18px;color:var(--muted)}
.set.warm > .num{color:var(--warn);font-weight:700}
.wu-note{font-size:13px;margin-top:4px}
.card .foot{align-items:center;flex-wrap:wrap;gap:6px}
.exrest{display:flex;align-items:center;gap:6px}
.exrest .mini{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:18px;line-height:1}
.exrest-v{min-width:3.4ch;text-align:center;font-weight:700}
.small-link{min-height:32px;font-size:14px}
.restctl .btn.small{padding:0 11px}
.setw .swipe-act button{width:88px;border-radius:0 10px 10px 0}
.set input{width:100%;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font:700 21px var(--font-num);font-variant-numeric:tabular-nums;padding:0 4px}
.set.done input{color:var(--muted);background:var(--surface)}
.plate{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.plate::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.plate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.plate[aria-pressed="true"]::after{border-color:var(--accent-ink);background:var(--accent)}
.card .foot{display:flex;justify-content:space-between}
.restbar{position:relative;flex:none;z-index:21;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.clock{font:800 36px/1 var(--font-num);font-variant-numeric:tabular-nums}
.restbar.running .clock{color:var(--accent)}
.restbar.over .clock{color:var(--good)}
.restctl{display:flex;gap:8px}

/* Tabs, sheets, toast */
.tabs{position:relative;flex:none;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:25px;height:25px}
.scrim{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font:800 21px/1.2 var(--font-num);margin:0 0 12px}
.sheet section{margin-top:14px}
.field{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 16px var(--scrim)}

/* Progress chart */
.chart svg{display:block;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:12px var(--font-ui);font-variant-numeric:tabular-nums}
.chart .line{stroke:var(--accent);stroke-width:2;fill:none}
.chart .area{fill:var(--accent-soft)}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .hl{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.readout{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.big{font:800 30px/1 var(--font-num)}
select.field{appearance:none;-webkit-appearance:none}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<main id="scroll"><div id="app"></div></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="wo" id="wo" hidden></div>
<div class="wo" id="sum" hidden></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file" accept=".csv,text/csv,text/plain" data-ch="file" hidden>

<script>
"use strict";
// ---------- Data ----------
const EQUIP=[["barbell","Barbell + rack"],["dumbbell","Dumbbells"],["machine","Machines"],["plate","Plate-loaded machines (Hammer Strength)"],["smith","Smith machine"],["cable","Cable station"],["kettlebell","Kettlebells"],["bench","Bench"],["pullupBar","Pull-up bar"]];

oward your hip, keeping your elbow close to your side.","Lower until your arm is straight and your shoulder stretches."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Machine Row":{"steps":["Adjust the seat so the handles are at chest height, chest against the pad.","Pull the handles back until your elbows pass your torso.","Return slowly to a full stretch."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Straight-Arm Pulldown":{"steps":["Face a high pulley holding a bar or rope with straight arms at eye level.","Hinge slightly and sweep the bar down to your thighs, keeping arms straight.","Let it rise slowly back to eye level."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Dumbbell Pullover":{"steps":["Lie across or along a bench holding one dumbbell with both hands above your chest.","With a slight elbow bend, lower the dumbbell back behind your head.","Pull it back over your chest using your lats and chest."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Overhead Press":{"steps":["Stand with the bar on your front shoulders, hands just outside them, core braced.","Press the bar straight overhead, moving your head back slightly to clear it.","Lower to your collarbones with control."],"tip":"Squeeze your glutes to avoid leaning back."},"Seated Dumbbell Press":{"steps":["Sit on an upright bench with dumbbells at shoulder height, palms forward.","Press up until your arms are straight overhead.","Lower slowly to shoulder level."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Machine Shoulder Press":{"steps":["Set the seat so the handles start at shoulder height.","Press up until your arms are nearly straight.","Lower slowly back to shoulder level."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Dumbbell Lateral Raise":{"steps":["Stand with dumbbells at your sides, slight bend in your elbows.","Raise your arms out to the sides until they are level with your shoulders.","Lower slowly. Lead with your elbows, not your hands."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Cable Lateral Raise":{"steps":["Stand side-on to a low pulley and hold the handle with your far hand.","Raise your arm out to the side to shoulder height.","Lower slowly back across your body."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Cable Face Pull":{"steps":["Set a rope at upper-chest height and grab it with thumbs pointing back.","Pull the rope toward your face, separating your hands and driving elbows high.","Return slowly to straight arms."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Reverse Pec Deck":{"steps":["Sit facing the pad with the handles set to the rear position.","With a slight elbow bend, sweep your arms back until they are in line with your body.","Return slowly to the front."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Barbell Curl":{"steps":["Stand holding a barbell with an underhand grip, hands shoulder width.","Curl the bar up to your chest while keeping your elbows at your sides.","Lower slowly to straight arms."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Dumbbell Curl":{"steps":["Stand with dumbbells at your sides, palms facing forward.","Curl both dumbbells up, keeping your elbows still.","Lower slowly to straight arms."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Incline Dumbbell Curl":{"steps":["Set a bench to about 45\u00b0 and lie back with arms hanging straight down.","Curl the dumbbells up without moving your upper arms.","Lower slowly to a full stretch."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Hammer Curl":{"steps":["Stand with dumbbells at your sides, palms facing in.","Curl up while keeping your palms facing each other.","Lower slowly."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Cable Curl":{"steps":["Attach a straight bar to a low pulley and stand facing it.","Curl the bar to your chest, elbows at your sides.","Lower slowly to straight arms."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Machine Preacher Curl":{"steps":["Set the seat so your upper arms rest flat on the pad.","Curl the handles up toward your shoulders.","Lower slowly until your arms are nearly straight."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Close-Grip Bench Press":{"steps":["Lie on a flat bench and grip the bar about shoulder width.","Lower the bar to your lower chest with elbows close to your body.","Press back up to straight arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Dips":{"steps":["Support yourself on parallel bars with straight arms.","Lower until your upper arms are about parallel to the floor, staying fairly upright.","Press back up to straight arms."],"tip":"Stop if you feel pain at the front of your shoulders."},"Cable Pushdown":{"steps":["Attach a bar to a high pulley. Stand with elbows pinned at your sides.","Push the bar down until your arms are straight.","Let it rise slowly until your forearms are just above parallel."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Overhead Dumbbell Extension":{"steps":["Hold one dumbbell with both hands overhead, seated or standing.","Lower it behind your head by bending only at the elbows.","Extend back up to straight arms."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Incline Barbell Skull Crusher":{"steps":["Set a bench to about 30\u00b0 and lie back holding a barbell or EZ-bar over your forehead.","Bend only at the elbows to lower the bar toward the top of your head.","Extend back up. The incline keeps tension on the triceps at the top."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Skull Crusher":{"steps":["Lie on a flat bench holding a barbell or EZ-bar with straight arms over your chest.","Bend at the elbows to lower the bar toward your forehead.","Extend back up without letting your elbows flare."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Back Squat":{"steps":["Set the bar across your upper back, feet about shoulder width, toes slightly out.","Brace and sit down between your hips until your thighs are at least parallel.","Drive up through mid-foot, keeping your chest up."],"tip":"If your lower back rounds at the bottom, stop a little higher."},"Front Squat":{"steps":["Rest the bar on your front shoulders with elbows high.","Squat down while keeping your torso upright.","Drive back up, keeping your elbows up the whole time."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Leg Press":{"steps":["Sit with your back flat on the pad and feet shoulder width on the platform.","Lower the platform until your knees reach about 90\u00b0 or a bit deeper.","Press back up without locking your knees hard."],"tip":"Don't let your lower back lift off the pad at the bottom."},"Single-Leg Leg Press":{"steps":["Sit in the leg press with one foot in the center of the platform.","Lower until your knee is about 90\u00b0.","Press back up and finish all reps before switching legs."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Hack Squat":{"steps":["Stand with your back and shoulders against the pads, feet shoulder width on the platform.","Release the safeties and squat down until your thighs are at least parallel.","Drive back up through your whole foot."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Goblet Squat":{"steps":["Hold a dumbbell vertically against your chest.","Squat down between your knees, chest up.","Stand back up through your heels."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Bulgarian Split Squat":{"steps":["Stand a stride in front of a bench and rest your back foot on it.","Lower straight down until your front thigh is about parallel.","Drive back up through your front foot. Do all reps, then switch."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Walking Lunge":{"steps":["Stand tall holding dumbbells at your sides.","Step forward and lower until both knees are about 90\u00b0.","Push off and bring your back foot forward into the next step."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Leg Extension":{"steps":["Sit with the pad on your lower shins and knees lined up with the machine's pivot.","Straighten your legs until they are fully extended.","Lower slowly."],"tip":"Move slowly and focus on squeezing the target muscle. Avoid swinging."},"Romanian Deadlift":{"steps":["Stand holding a barbell at your thighs, knees slightly bent.","Push your hips back and lower the bar along your legs with a flat back.","Stop at a deep hamstring stretch, then drive your hips forward to stand."],"tip":"Keep your knees soft but fixed. The movement is a hip hinge, not a squat."},"Dumbbell Romanian Deadlift":{"steps":["Stand holding dumbbells in front of your thighs, knees slightly bent.","Push your hips back and lower the dumbbells along your legs.","Stand back up by driving your hips forward."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Kettlebell Swing":{"steps":["Stand with feet wider than shoulders and a kettlebell on the floor in front of you.","Hike it between your legs, then snap your hips forward to swing it to chest height.","Let it fall back between your legs and repeat. Power comes from your hips, not your arms."],"tip":"The kettlebell ow up and back, pulling your elbows toward your hips.","Lower to straight arms with control."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Chest-Supported T-Bar Row":{"steps":["Lie chest-down on the pad and grab the handles.","Row the weight up until your elbows pass your torso.","Lower slowly to straight arms without lifting your chest off the pad."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"T-Bar Row":{"steps":["Straddle the bar with a row handle under the plates. Hinge to about 45\u00b0 with a flat back.","Row the handle to your chest, squeezing your shoulder blades.","Lower slowly to straight arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Pendlay Row":{"steps":["Set up like a barbell row with your torso nearly parallel to the floor, bar on the ground.","Pull the bar explosively to your lower chest.","Return it to the floor and reset each rep."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Rack Pull":{"steps":["Set the bar in a rack at knee height. Grip it like a deadlift.","Brace, flatten your back, and stand up tall.","Lower to the pins with control and reset."],"tip":"Use this to build lockout strength. Keep your back flat."},"Chest-Supported Dumbbell Row":{"steps":["Set an incline bench to about 30\u00b0 and lie chest-down with a dumbbell in each hand.","Row the dumbbells toward your hips, squeezing your back.","Lower slowly to straight arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Close-Grip Lat Pulldown":{"steps":["Attach a close-grip handle and sit with your thighs under the pads.","Pull the handle to your upper chest, elbows tight to your sides.","Return slowly to straight arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Single-Arm Cable Row":{"steps":["Set a handle at chest height and stand or sit facing the cable.","Row the handle to your side, pulling your elbow back past your body.","Return slowly, letting your shoulder reach forward."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Cable Shotgun Row":{"steps":["Set a handle at the lowest pulley. Stand or half-kneel facing it and grab the handle with one hand, palm facing in.","Row the handle up and back to your hip, rotating your palm to face up and pulling your elbow past your body.","Return slowly to a full stretch with your arm straight. Do all reps, then switch arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Single-Arm Lat Pulldown":{"steps":["Attach a single handle to the high pulley and sit or kneel facing it.","Pull the handle down to your shoulder, driving your elbow down toward your hip.","Let it rise slowly to a full stretch overhead. Do all reps, then switch arms."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Meadows Row":{"steps":["Wedge one end of a barbell in a landmine or corner. Stand side-on to the other end in a staggered stance.","Grab the end of the bar with an overhand grip and row it up toward your hip, elbow flaring slightly out.","Lower to a full stretch. Do all reps, then switch sides."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Seal Row":{"steps":["Lie face down on a high flat bench with a barbell on the floor below you.","Row the bar up to the underside of the bench, squeezing your shoulder blades together.","Lower to straight arms. Your lower back stays out of it."],"tip":"Brace your core before each rep and use a full, controlled range of motion."},"Chin-Up":{"steps":["Hang from the bar with palms facing you, hands about shoulder width.","Pull your chin over the bar, driving elbows down to your sides.","Lower slowly to a full hang."],"tip":"Brace your core before each rep and use a full, controlled rang function loggedCount(){return S.active?S.active.items.reduce((n,it)=>n+it.done.filter(Boolean).length,0):0}

  if(viaSet&&S.settings.shortcut){persistNow().finally(()=>{location.href=`shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${sec}`})}

    if(sets.length)S.sessions.push({id:uid(),title:a.title,start:a.tStart||a.start,end:Date.now(),dur:a.tStart?elapsedMs(a):null,sets})}

// ---------- Workout summary ----------
// Calories: MET 5 (vigorous weight training) x bodyweight in kg x active hours. Needs bodyweight from the profile.
function sessionStats(s){
  const ms=s.dur||s.end-s.start,mins=Math.max(1,Math.round(ms/60000));
  const vol=s.sets.reduce((n,y)=>n+y.w*y.reps,0);
  const bw=(S.settings.profile||{}).bw;const kcal=bw?Math.round(5*bw*0.4536*ms/3600000):null;
  const prev=finished().filter(x=>x.id!==s.id&&x.start<s.start);
  const names=[];for(const x of [...s.sets].sort((a,b)=>a.t-b.t))if(!names.includes(x.ex))names.push(x.ex);
  const exercises=names.map(name=>{
    const cur=s.sets.filter(x=>x.ex===name&&!x.wu),old=prev.flatMap(x=>x.sets.filter(y=>y.ex===name&&!y.wu));if(!cur.length)return null;
    const best=cur.reduce((a,x)=>!a||e1rm(x.w,x.reps)>e1rm(a.w,a.reps)||(x.w===0&&x.reps>a.reps)?x:a,null);
    const curE=Math.max(0,...cur.map(x=>e1rm(x.w,x.reps))),oldE=Math.max(0,...old.map(x=>e1rm(x.w,x.reps)));
    const curW=Math.max(0,...cur.map(x=>x.w)),oldW=Math.max(0,...old.map(x=>x.w));
    const curR=Math.max(0,...cur.map(x=>x.reps)),oldR=Math.max(0,...old.map(x=>x.reps));
    const prs=[];
    if(old.length){
      if(curE>0&&Math.round(curE)>Math.round(oldE))prs.push({kind:"Projected 1RM",val:`${fmtNum(curE)} lb`,delta:`+${fmtNum(curE-oldE)} lb`});
      if(curW>0&&curW>oldW)prs.push({kind:"Heaviest weight",val:`${fmtW(curW)} lb${wlab(name)}`,delta:`+${fmtW(curW-oldW)} lb`});
      if(curW===0&&oldW===0&&curR>oldR)prs.push({kind:"Most reps",val:`${curR} reps`,delta:`+${curR-oldR}`});
    }
    return{name,best,curE,first:!old.length,prs}}).filter(Boolean);
  return{mins,vol,sets:s.sets.filter(x=>!x.wu).length,kcal,exercises,prCount:exercises.reduce((n,e)=>n+e.prs.length,0)};
}
function statsGrid(st){return`<div class="stats">
  <div><div class="meta">Duration</div><div class="big num">${st.mins} min</div></div>
  <div><div class="meta">Calories</div><div class="big num">${st.kcal!=null?`${fmtNum(st.kcal)}`:"–"}</div>${st.kcal!=null?`<div class="meta">kcal, estimated</div>`:`<div class="meta">Add bodyweight in Gym</div>`}</div>
  <div><div class="meta">Volume</div><div class="big num">${fmtNum(st.vol)}</div><div class="meta">lb lifted</div></div>
  <div><div class="meta">Sets</div><div class="big num">${st.sets}</div></div></div>`}
function prList(st){const rows=st.exercises.flatMap(e=>e.prs.map((p,i)=>`<div class="row pr" style="--d:${i}"><span class="prico">${ICON.trophy}</span><span class="grow"><span class="name">${esc(e.name)}</span><br><span class="meta">${p.kind}: <span class="num" style="color:var(--ink);font-weight:700">${p.val}</span> (${p.delta})</span></span></div>`));
  return rows.length?`<section><h2>${rows.length} personal record${rows.length===1?"":"s"}</h2><div class="rows">${rows.join("")}</div></section>`:""}
function exList(st){return`<section><h2>Exercises</h2><div class="rows">${st.exercises.map(e=>`<div class="row"><span class="grow"><span class="name">${esc(e.name)}</span><br><span class="meta">${e.best?`Best set ${e.best.w?`${fmtW(e.best.w)} lb${wlab(e.name)} × `:""}${e.best.reps}`:""}${e.first?", first time logged":""}</span></span>${e.curE?`<span class="right"><span class="num" style="font-weight:700">${fmtNum(e.curE)} lb</span><br><span class="meta">projected 1RM</span></span>`:""}</div>`).join("")}</div></section>`}
let summaryId=null;
function renderSummary(){const el=$("#sum");const s=summaryId&&S.sessions.find(x=>x.id===summaryId);
  if(!s){el.hidden=true;el.innerHTML="";return}
  const st=sessionStats(s);

    <div class="sum-h"><span class="badge">${ICON.check}</span><div><div class="wo-title">${st.prCount?"New personal records!":"Workout complete"}</div><div class="sub">${esc(s.title)}, ${dateLong(s.start)}</div></div></div>

// Bumper-plate colored confetti. Skipped when the phone asks for reduced motion.
function confetti(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.className="confetti";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
  const dpr=devicePixelRatio||1,W=innerWidth,H=c.getBoundingClientRect().height||innerHeight;c.width=W*dpr;c.height=H*dpr;
  const g=c.getContext("2d");g.scale(dpr,dpr);
  const cols=["#D7263D","#1B58C2","#E8B31E","#1F8048","#F3F5F8"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80,y:H*.3,vx:(Math.random()-.5)*13,vy:-Math.random()*14-5,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],disc:Math.random()<.35}));
  const t0=performance.now();
  (function frame(t){const el=(t-t0)/1000;g.clearRect(0,0,W,H);
    for(const p of ps){p.vy+=.38;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,1-Math.max(0,el-1.6));g.fillStyle=p.c;
      if(p.disc){g.beginPath();g.arc(0,0,p.w/2,0,Math.PI*2);g.fill();g.globalCompositeOperation="destination-out";g.beginPath();g.arc(0,0,p.w/6,0,Math.PI*2);g.fill()}
      else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}
    if(el<2.7)requestAnimationFrame(frame);else c.remove()})(t0);
}

// ---------- CSV ----------
const CSV_HEADER=["Workout Start","Workout End","Workout","Exercise","Set","Reps","Weight (lb)","Completed At","Warm-up"];
function localISO(t){const d=new Date(t);const p=n=>String(n).padStart(2,"0");const off=-d.getTimezoneOffset();const a=Math.abs(off);
  return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${off>=0?"+":"-"}${p(Math.floor(a/60))}:${p(a%60)}`}
function toCSV(){const q=v=>/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;const lines=[CSV_HEADER.join(",")];
  for(const s of [...finished()].sort((a,b)=>a.start-b.start))for(const x of [...s.sets].sort((a,b)=>a.t-b.t))
    lines.push([localISO(s.start),localISO(s.end),s.title,x.ex,String(x.n),String(x.reps),fmtW(x.w),localISO(x.t),x.wu?"yes":""].map(q).join(","));
  return lines.join("\n")+"\n"}
function parseRows(text){const rows=[];let row=[],f="",q=false;const s=text.replace(/\r\n?/g,"\n");
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function parseDate(s){if(!s)return null;let t=Date.parse(s);if(!isNaN(t))return t;t=Date.parse(s.replace(" ","T"));if(!isNaN(t))return t;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);if(m)return new Date(+m[3],m[1]-1,+m[2],+(m[4]||0),+(m[5]||0)).getTime();return null}
function importCSV(text){
  const rows=parseRows(text.replace(/^﻿/,"")).filter(r=>r.some(c=>c.trim()));if(!rows.length)throw new Error("The file is empty.");
  const cols=rows[0].map(c=>c.trim().toLowerCase());const col=(...n)=>{for(const x of n){const i=cols.indexOf(x.toLowerCase());if(i>=0)return i}return -1};
  const iS=col("Workout Start"),iX=col("Exercise"),iR=col("Reps");
  if(iS<0||iX<0||iR<0)throw new Error("The file needs at least these columns: Workout Start, Exercise, Reps.");
  const iEnd=col("Workout End"),iT=col("Workout"),iSet=col("Set"),iW=col("Weight (lb)","Weight"),iC=col("Completed At"),iWU=col("Warm-up");
  const existing=new Set(S.sessions.map(s=>Math.floor(s.start/1000)));
  const map=new Map(),counters={},lastT={},dup=new Set();let sets=0,bad=0;
  for(const row of rows.slice(1)){const v=i=>i>=0&&i<row.length?row[i].trim():"";
    const start=parseDate(v(iS));if(start==null){bad++;continue}
    const key=Math.floor(start/1000);if(existing.has(key)){dup.add(key);continue}
    const name=canonical(v(iX));const reps=parseInt(v(iR),10);if(!name||isNaN(reps)){bad++;continue}
    let s=map.get(key);if(!s){s={id:uid(),title:v(iT)||"Workout",start,end:null,sets:[]};map.set(key,s)}
    const ck=key+"|"+name+(/^(yes|true|1|w)$/i.test(v(iWU))?"|wu":"");const n=parseInt(v(iSet),10)||((counters[ck]||0)+1);counters[ck]=n;
    const t=parseDate(v(iC))??((lastT[key]??start)+120000);lastT[key]=Math.max(lastT[key]??t,t);
    const row1={ex:name,n,reps,w:parseFloat(v(iW))||0,t};if(/^(yes|true|1|w)$/i.test(v(iWU)))row1.wu=true;s.sets.push(row1);sets++;
    const end=parseDate(v(iEnd));if(end!=null)s.end=end}
  for(const[k,s]of map){if(s.end==null)s.end=lastT[k]??s.start;S.sessions.push(s)}
  save();
  let msg=`Imported ${map.size} workout${map.size===1?"":"s"} (${sets} sets).`;
  if(dup.size)msg+=` Skipped ${dup.size} already in LiftLog.`;if(bad)msg+=` ${bad} rows couldn't be read.`;
  return msg;
}

let PTS=[],SEL=0;
const METRICS={e1rm:"Est. 1RM",top:"Top weight",volume:"Volume"};
function series(name,metric){const by={};
  for(const s of finished())for(const x of s.sets){if(x.ex!==name||x.wu)continue;const d=new Date(x.t);const k=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();(by[k]=by[k]||[]).push(x)}
  return Object.entries(by).map(([k,a])=>({d:+k,v:metric==="e1rm"?Math.max(...a.map(x=>e1rm(x.w,x.reps))):metric==="top"?Math.max(...a.map(x=>x.w)):a.reduce((n,x)=>n+x.w*x.reps,0)})).sort((a,b)=>a.d-b.d)}
function vProgress(){
  const counts={};for(const s of finished())for(const x of s.sets)counts[x.ex]=(counts[x.ex]||0)+1;
  const names=Object.keys(counts).sort();

  PTS=series(S.ui.pEx,S.ui.metric);SEL=PTS.length-1;

}
function ticks(lo,hi,n=4){const raw=(hi-lo)/n||1;const mag=10**Math.floor(Math.log10(raw));const step=[1,2,2.5,5,10].map(f=>f*mag).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const out=[];for(let v=a;v<=b+step*1e-6;v+=step)out.push(+v.toFixed(6));return out}
function drawChart(){
  const el=$("#chart");if(!el||!PTS.length)return;
  const W=Math.max(260,el.clientWidth),H=210,m={l:52,r:14,t:12,b:28},pw=W-m.l-m.r,ph=H-m.t-m.b;
  let lo=Math.min(...PTS.map(p=>p.v)),hi=Math.max(...PTS.map(p=>p.v));if(hi-lo<10){lo-=5;hi+=5}
  const T=ticks(lo,hi);const y0=T[0],y1=T[T.length-1];const d0=PTS[0].d,d1=PTS[PTS.length-1].d;
  const X=d=>PTS.length===1?m.l+pw/2:m.l+(d-d0)/(d1-d0)*pw, Y=v=>m.t+(1-(v-y0)/(y1-y0))*ph;
  const line=PTS.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const area=PTS.length>1?`<path class="area" d="${line}L${X(d1).toFixed(1)},${m.t+ph}L${X(d0).toFixed(1)},${m.t+ph}Z" opacity=".55"/>`:"";
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(METRICS[S.ui.metric])} for ${esc(S.ui.pEx)}">
   ${T.map(t=>`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${fmtNum(t)}</text>`).join("")}
   ${area}<path class="line" d="${line}"/>
   ${PTS.map(p=>`<circle class="dot" cx="${X(p.d)}" cy="${Y(p.v)}" r="4"/>`).join("")}
   <circle class="hl" id="hl" r="6" cx="0" cy="0"/>
   <text class="axis" x="${PTS.length===1?X(d0):m.l}" y="${H-8}" text-anchor="${PTS.length===1?"middle":"start"}">${dateShort(d0)}</text>
   ${PTS.length>1?`<text class="axis" x="${W-m.r}" y="${H-8}" text-anchor="end">${dateShort(d1)}</text>`:""}
   <rect id="hit" x="${m.l-10}" y="0" width="${pw+20}" height="${H}" fill="transparent"/></svg>`;
  const pickAt=e=>{const r=el.querySelector("svg").getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width);let bi=0,bd=Infinity;PTS.forEach((p,i)=>{const d=Math.abs(X(p.d)-x);if(d<bd){bd=d;bi=i}});SEL=bi;readout(X,Y)};
  const hit=el.querySelector("#hit");hit.addEventListener("pointerdown",pickAt);hit.addEventListener("pointermove",pickAt);
  readout(X,Y);
}
function readout(X,Y){const p=PTS[SEL];if(!p)return;const hl=$("#hl");hl.setAttribute("cx",X(p.d));hl.setAttribute("cy",Y(p.v));
  $("#ro-v").textContent=`${fmtNum(p.v)} lb`;$("#ro-d").textContent=`${METRICS[S.ui.metric]}, ${dateShort(p.d)}`}

function units(items){const out=[];for(const it of items){const last=out[out.length-1];

// Keep each superset contiguous with at least 2 members; otherwise drop the grouping.
function normalizeGroups(){const items=S.active.items,count={};
  units(items).forEach(u=>{if(u.group)count[u.group]=(count[u.group]||0)+1});
  for(const it of items){if(!it.group)continue;const members=items.filter(x=>x.group===it.group).length;if(members<2||count[it.group]>1)it.group=null}}

let ctlMode="",beepedFor=null,audio=null;
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==="suspended")audio.resume()}catch(e){}}
function beep(){try{if(!audio)return;const t=audio.currentTime;[0,.25,.5].forEach(o=>{const g=audio.createGain(),osc=audio.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.4,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.18);osc.connect(g).connect(audio.destination);osc.start(t+o);osc.stop(t+o+.2)})}catch(e){}}
function tick(){
  const a=S.active;if(!a)return;const el=$("#elapsed")||$(".wtimer");if(!el)return;
  if(el.id==="elapsed")el.textContent=fmtClock(elapsedMs(a));
  const bar=$("#restbar"),lab=$("#rest-label"),clk=$("#rest-time"),ctl=$("#rest-ctl");
  let mode;
  if(a.paused){mode="paused";lab.textContent="Workout paused";clk.textContent=a.restLeft!=null?mmss(Math.ceil(a.restLeft/1000)):fmtClock(elapsedMs(a))}
  else if(a.restEnd){const rem=Math.ceil((a.restEnd-Date.now())/1000);
    if(rem>0){mode="run";lab.textContent=a.restWhy?`Resting, ${a.restWhy}`:"Resting";clk.textContent=mmss(rem)}
    else{mode="over";lab.textContent="Rest is over";clk.textContent="Next set";if(beepedFor!==a.restEnd){beepedFor=a.restEnd;beep()}}}
  else if(a.nextUp){mode="next";lab.textContent="Superset, no rest. Next:";clk.textContent=a.nextUp}
  else{mode="idle";lab.textContent=S.settings.dynRest?"Base rest, adjusts to each set":"Rest between sets";clk.textContent=mmss(a.rest)}
  clk.classList.toggle("small",mode==="next");
  bar.className="restbar"+(mode==="run"?" running":mode==="over"?" over":"");if(mode==="paused")lab.textContent=a.restLeft!=null?"Workout paused, rest left":"Workout paused";
  if(mode!==ctlMode){ctlMode=mode;
    ctl.innerHTML=mode==="paused"?`<button class="btn small go" data-a="pauseToggle">Resume</button>`
     :mode==="run"?`<button class="btn small" data-a="restShift" data-d="-15" aria-label="15 seconds less rest">−15s</button><button class="btn small" data-a="restShift" data-d="15" aria-label="15 seconds more rest">+15s</button><button class="btn small" data-a="restSkip">Skip</button>`
     :mode==="over"?`<button class="btn small" data-a="restSkip">Dismiss</button>`
     :mode==="next"?``
     :`<button class="btn small" data-a="restAdj" data-d="-15" aria-label="Shorter rest">−15s</button><button class="btn small" data-a="restAdj" data-d="15" aria-label="Longer rest">+15s</button>`}
}

  "JM Press":"jmpress","Farmer's Carry (seconds)":"farmerswalk carry grip","Dead Hang (seconds)":"grip hang","Barbell Wrist Curl":"forearm","Reverse Wrist Curl":"forearm","Dumbbell Wrist Curl":"forearm",
  "Glute-Ham Raise":"ghr","Stiff-Leg Deadlift":"sldl","Sissy Squat":"sissy","Cable Hip Abduction":"abductor outerthigh","Cross-Body Hammer Curl":"crossbody pinwheel","Single-Arm Lat Pulldown":"onearm singlearm unilateral","Meadows Row":"landminerow onearm",
  "Seal Row":"chestsupported","Cable Y-Raise":"yraise lowertrap","Reverse EZ-Bar Curl":"forearm brachioradialis","Incline Hammer Curl":"hammer","Cable Shotgun Row":"shotgunrow singlearm onearm lowrow","Bayesian Cable Curl":"behindbackcablecurl baesian bayes bayesean","Cable Face Pull":"rearDelt facepull",
  "Hip Thrust Machine":"glutedrive","Reverse Pec Deck":"reardeltfly rearflye","Machine Fly":"pecdeck flye","Cable Fly":"cablecrossover flye",
  "Romanian Deadlift":"rdl","Dumbbell Romanian Deadlift":"rdl","Single-Leg Romanian Deadlift":"rdl","Overhead Press":"ohp militarypress shoulderpress",
  "Barbell Bench Press":"flatbench","Skull Crusher":"skullcrusher lyingtricepextension","Overhead Cable Extension":"overheadtricepextension",
  "Seated Cable Row":"lowrow","Standing Calf Raise":"calfmachine","Lat Pulldown":"latpulldown widegrip",
  "Bulgarian Split Squat":"rfess splitsquat","Hack Squat":"hacksquat","Back Squat":"barbellsquat"};
const normQ=t=>t.toLowerCase().replace(/[^a-z0-9]/g,"");
const HAY={};const hay=e=>HAY[e.name]||(HAY[e.name]=normQ(e.name+e.muscle+e.equipment.map(q=>EQ_LABEL[q]).join("")+(e.name.includes("Hammer Strength")?"hammerstrength hs":"")
  +(/Single-Arm|One-Arm/.test(e.name)?"singlearm onearm":"")+(/Single-Leg/.test(e.name)?"oneleg":"")
  +(SEARCH_ALSO[e.name]||"")+(e.equipment.includes("dumbbell")?"db":"")+(e.equipment.includes("barbell")?"bb":"")));
// ---------- Plate calculator ----------
// Greedy fill with the plates you have; standard plate sets make the greedy answer the fewest plates.
const PLATES=[45,35,25,10,5,2.5];
const PLATE_LOOK={45:["#1B58C2",62],35:["#E8B31E",54],25:["#1F8048",46],10:["#E9ECF0",36],5:["#C2283A",30],2.5:["#8A93A3",24]};
let calc={name:null,w:135,bar:45,mode:"bar"};
const plateCfg=()=>Object.assign({bar:45,have:PLATES.slice()},S.settings.plates||{});
function fillPlates(perSide,have){const out=[];let rem=Math.round(perSide*100)/100;
  for(const p of [...have].sort((a,b)=>b-a))while(rem+1e-9>=p){out.push(p);rem=Math.round((rem-p)*100)/100}return{plates:out,rem}}
function openCalc(name,w){const e=name&&byName[name];
  calc={name:name||null,w:w>0?w:(e&&e.plates==="bar"?135:90),mode:e&&e.plates?e.plates:"bar",bar:name&&/EZ-Bar/.test(name)?25:plateCfg().bar};
  openSheet(`<h3>Plate calculator</h3>${name?`<div class="sub" style="margin-top:-6px">${esc(name)}</div>`:""}<div id="calc"></div>`);renderCalc(true)}
function renderCalc(full){const box=$("#calc");if(!box)return;const cfg=plateCfg(),m=calc.mode;
  if(full)box.innerHTML=`<label class="optrow calc-w" for="calc-in"><span>${m==="bar"?"Total weight":m==="two"?"Plates added":loadOf(calc.name)==="side"?"Weight per side":"Plates on the sleeve"}</span>
     <span class="bwbox"><input class="field num" id="calc-in" inputmode="decimal" autocomplete="off" data-in="calcw" value="${fmtW(calc.w)}"><span class="meta">lb</span></span></label>
    <div class="seg" style="margin-top:10px">${[["bar","Barbell"],["two","Both sides"],["one","One side"]].map(([k,l])=>`<button data-a="calcMode" data-v="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>
    ${m==="bar"?`<div class="optrow" style="margin-top:12px"><span>Bar</span><div class="seg" style="flex:1;max-width:260px">${[45,35,25,15].map(b=>`<button data-a="calcBar" data-v="${b}" aria-pressed="${calc.bar===b}">${b}</button>`).join("")}</div></div>`:""}
    <div id="calc-res"></div>
    <section><h2>Plates you have</h2><div class="mgrid">${PLATES.map(p=>`<button class="chip" data-a="plateHave" data-v="${p}" aria-pressed="${cfg.have.includes(p)}">${fmtW(p)}</button>`).join("")}</div></section>
    <div class="actions"><button class="btn" data-a="closeSheet">Done</button></div>`;
  const per=m==="bar"?(calc.w-calc.bar)/2:m==="two"?calc.w/2:calc.w;
  let html;
  if(!(calc.w>0))html=`<p class="meta">Enter a weight.</p>`;
  else if(m==="bar"&&per<0)html=`<p class="meta">That's less than the ${calc.bar} lb bar.</p>`;
  else{const{plates,rem}=fillPlates(Math.max(0,per),cfg.have);
    const loaded=m==="bar"?calc.bar+2*(per-rem):m==="two"?2*(per-rem):per-rem;
    const label=m!=="one"?"Each side":loadOf(calc.name)==="side"?"Each arm's side":"On the sleeve";
    const W=300,H=74;let x=34;
    const rects=plates.map(p=>{const[c,h]=PLATE_LOOK[p],w=p>=25?13:p>=10?10:8,r=`<rect x="${x}" y="${(H-h)/2}" width="${w}" height="${h}" rx="2" fill="${c}" class="plt"/>`;x+=w+2;return r}).join("");
    html=`<div class="calc-out"><div class="optrow"><span class="meta">${label}</span><span class="big num" style="font-size:24px">${plates.length?plates.map(fmtW).join(" + "):"No plates"}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${label}: ${plates.map(fmtW).join(", ")||"no plates"}"><rect x="0" y="${H/2-4}" width="${W}" height="8" rx="3" class="sleeve"/><rect x="24" y="${H/2-12}" width="8" height="24" rx="2" class="collar"/>${rects}</svg>
      ${rem>0?`<p class="meta">Can't make that exactly with your plates. Closest: <b class="num">${fmtW(loaded)} lb</b>${m==="bar"?" total":""}.</p>`:m==="bar"?`<p class="meta">Includes the ${calc.bar} lb bar.</p>`:m==="two"?`<p class="meta">Load the same on both sides. The bar or sled isn't counted.</p>`:""}</div>`}
  $("#calc-res").innerHTML=html}

// ---------- Exercise details ----------
// Simple front/back body map: primary muscle filled, secondary muscles tinted.
function bodyMap(e){const prim=e?e.muscle:null,sec=new Set(e?e.secondary:[]);
  const cls=m=>m===prim?"mp":sec.has(m)?"ms":"mo";
  const fig=(x,label,parts)=>`<g transform="translate(${x},0)"><circle class="bd" cx="50" cy="16" r="10"/><rect class="bd" x="45" y="25" width="10" height="7" rx="2"/>
    <path class="bd" d="M27 34 Q50 28 73 34 L70 98 Q50 104 30 98 Z"/><rect class="bd" x="15" y="36" width="12" height="62" rx="6"/><rect class="bd" x="73" y="36" width="12" height="62" rx="6"/>
    <rect class="bd" x="31" y="98" width="17" height="94" rx="8"/><rect class="bd" x="52" y="98" width="17" height="94" rx="8"/>${parts}<text class="bl" x="50" y="208" text-anchor="middle">${label}</text></g>`;
  const front=`<circle class="${cls("shoulders")}" cx="28" cy="40" r="7"/><circle class="${cls("shoulders")}" cx="72" cy="40" r="7"/>
    <ellipse class="${cls("chest")}" cx="41" cy="50" rx="10" ry="8"/><ellipse class="${cls("chest")}" cx="59" cy="50" rx="10" ry="8"/>
    <ellipse class="${cls("forearms")}" cx="20" cy="86" rx="4.5" ry="11"/><ellipse class="${cls("forearms")}" cx="80" cy="86" rx="4.5" ry="11"/>
    <ellipse class="${cls("biceps")}" cx="21" cy="60" rx="5" ry="11"/><ellipse class="${cls("biceps")}" cx="79" cy="60" rx="5" ry="11"/>
    <rect class="${cls("core")}" x="41" y="62" width="18" height="33" rx="5"/>
    <ellipse class="${cls("quads")}" cx="39.5" cy="128" rx="7.5" ry="21"/><ellipse class="${cls("quads")}" cx="60.5" cy="128" rx="7.5" ry="21"/>`;
  const back=`<ellipse class="${cls("back")}" cx="50" cy="40" rx="14" ry="6"/><ellipse class="${cls("back")}" cx="40" cy="64" rx="9" ry="17"/><ellipse class="${cls("back")}" cx="60" cy="64" rx="9" ry="17"/>
    <circle class="${cls("shoulders")}" cx="28" cy="40" r="7"/><circle class="${cls("shoulders")}" cx="72" cy="40" r="7"/>
    <ellipse class="${cls("forearms")}" cx="20" cy="86" rx="4.5" ry="11"/><ellipse class="${cls("forearms")}" cx="80" cy="86" rx="4.5" ry="11"/>
    <ellipse class="${cls("triceps")}" cx="21" cy="60" rx="5" ry="11"/><ellipse class="${cls("triceps")}" cx="79" cy="60" rx="5" ry="11"/>
    <ellipse class="${cls("glutes")}" cx="40" cy="105" rx="9" ry="8"/><ellipse class="${cls("glutes")}" cx="60" cy="105" rx="9" ry="8"/>
    <ellipse class="${cls("hamstrings")}" cx="39.5" cy="134" rx="7" ry="17"/><ellipse class="${cls("hamstrings")}" cx="60.5" cy="134" rx="7" ry="17"/>
    <ellipse class="${cls("calves")}" cx="39.5" cy="171" rx="6" ry="13"/><ellipse class="${cls("calves")}" cx="60.5" cy="171" rx="6" ry="13"/>`;
  return`<svg class="bodymap" viewBox="0 0 230 214" role="img" aria-label="Muscles worked: ${prim?cap(prim):""}${[...sec].length?", also "+[...sec].map(cap).join(", "):""}">${fig(10,"Front",front)}${fig(120,"Back",back)}</svg>`}
function openDetails(name){const e=byName[name],h=HOWTO[name];
  const q=encodeURIComponent(`${name} exercise form`);
  openSheet(`<h3>${esc(name)}</h3>
    ${e?`<div class="det-map">${bodyMap(e)}<div class="det-legend"><span><i class="sw mp"></i>${cap(e.muscle)}</span>${e.secondary.length?`<span><i class="sw ms"></i>Also: ${e.secondary.map(cap).join(", ")}</span>`:""}
      <span class="meta">${e.equipment.map(x=>EQ_LABEL[x]).join(" + ")}, ${e.compound?"compound":"isolation"}</span>
      <span class="meta"><b>Weight:</b> ${LOAD_HELP[e.load||""]}</span></div></div>`:""}
    ${h?`<section><h2>How to do it</h2><ol class="steps">${h.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="tip"><b>Tip:</b> ${esc(h.tip)}</p></section>`
      :`<p class="meta">No instructions for this custom exercise yet.</p>`}
    <div class="actions"><a class="btn" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">${ICON.play}Watch a demo on YouTube</a>
    <button class="btn" data-a="closeSheet">Close</button></div>`)}
function openPicker(cb,{title="Add exercise",muscle="all",taken=[]}={}){
  pickCb=cb;pickQ="";pickM=muscle;pickTaken=new Set(taken);
  openSheet(`<h3>${esc(title)}</h3><div class="pick-head"><input class="field" id="pick-q" type="search" data-in="pickq" placeholder="Search all exercises" autocomplete="off" aria-label="Search exercises">
    <div class="chips" id="pick-m" style="margin-top:10px" aria-label="Filter by muscle group"></div></div><div id="pick-list"></div>`);renderPick()}
function renderPick(){
  $("#pick-m").innerHTML=["all",...MUSCLES].map(m=>`<button class="chip" data-a="pickM" data-v="${m}" aria-pressed="${pickM===m}">${m==="all"?"All":cap(m)}</button>`).join("");
  const ql=pickQ.trim().toLowerCase();const STOP=new Set(["the","a","an","of","with","on","and","to","for"]);
  const words=ql.split(/\s+/).filter(w=>!STOP.has(w)).map(w=>{w=normQ(w);return w.length>=3&&w.endsWith("s")?w.slice(0,-1):w}).filter(Boolean);
  const match=e=>(pickM==="all"||e.muscle===pickM)&&(!words.length||words.every(w=>hay(e).includes(w)));
  const row=e=>{const taken=pickTaken.has(e.name);return`<div class="row pickrow"><button class="grow pickbtn" data-a="pick" data-v="${esc(e.name)}" ${taken?"disabled":""}><span class="name">${esc(e.name)}</span><br><span class="meta">${taken?"Already in this workout":(rating(e.name)>0?"Liked, ":rating(e.name)<0?"Recommended less, ":"")+e.equipment.map(q=>EQ_LABEL[q]).join(" + ")}</span></button><button class="ibtn" data-a="howTo" data-n="${esc(e.name)}" aria-label="How to do ${esc(e.name)}">${ICON.info}</button></div>`};
  let html="";
  if(ql&&!LIB.some(e=>normQ(e.name)===normQ(ql)))html+=`<section><div class="rows"><button class="row add" data-a="pick" data-v="${esc(pickQ.trim())}">${ICON.plus}Add “${esc(pickQ.trim())}” as a new exercise</button></div></section>`;
  const groups=(pickM==="all"?MUSCLES:[pickM]).map(m=>[m,LIB.filter(e=>e.muscle===m&&match(e))]).filter(([,l])=>l.length);
  const also=pickM==="all"?[]:LIB.filter(e=>e.muscle!==pickM&&e.secondary.includes(pickM)&&(!words.length||words.every(w=>hay(e).includes(w))));
  html+=groups.map(([m,l])=>`<section><h2>${cap(m)}</h2><div class="rows">${l.map(row).join("")}</div></section>`).join("");
  if(also.length)html+=`<section><h2>Also works ${pickM}</h2><div class="rows">${also.map(row).join("")}</div></section>`;
  if(!groups.length&&!ql)html+=`<p class="meta">No exercises in this group.</p>`;
  if(!groups.length&&ql)html+=`<p class="meta">No ${pickM==="all"?"":cap(pickM).toLowerCase()+" "}exercises match “${esc(pickQ.trim())}”.${pickM!=="all"?" Try All.":""}</p>`;
  $("#pick-list").innerHTML=html}
function listFor(ctx){return ctx==="plan"?S.ui.plan:ctx==="rt"?routine().items:S.active.items}
function rerender(ctx){ctx==="wo"?renderWorkout():render()}
function newItem(ctx,name,old){
  if(ctx==="plan")return planFor(name);
  if(ctx==="rt")return{id:uid(),name,sets:old?old.sets:3,reps:old?old.reps:10};
  const[sets,reps]=scheme(name);return activeItem(old?{name,sets:old.w.length-(old.wu||0),reps:old.reps}:{name,sets,reps})}
function replaceEx(ctx,id,name){const list=listFor(ctx);const i=list.findIndex(x=>x.id===id);if(i<0)return;const old=list[i];list[i]=newItem(ctx,name,old);
  if(ctx==="wo"){list[i].group=old.group||null;list[i].open=true}}
const doneCount=(ctx,it)=>ctx==="wo"?it.done.filter(Boolean).length:0;

// ---------- Actions ----------

const A={

  saveRoutineAsk:()=>openSheet(`<h3>Save as routine</h3><input class="field" id="new-rname" value="${esc(focusName()?focusName()+(S.ui.focus==="Choose muscles"?"":" Day"):"My Routine")}" aria-label="Routine name"><div class="actions"><button class="btn primary" data-a="saveRoutine">Save routine</button><button class="btn" data-a="closeSheet">Cancel</button></div>`),

  allow:d=>{S.settings.excluded=S.settings.excluded.filter(n=>n!==d.v);save();render()},
  testShortcut:()=>{location.href=`shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=10`},
  export:async()=>{const csv=toCSV();const name=`LiftLog workouts ${localISO(Date.now()).slice(0,10)}.csv`;
    try{const file=new File([csv],name,{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("CSV exported")}catch(e){toast("Export isn't available in this browser.")}},
  // workout
  set:d=>{const a=S.active,it=woItem(d.id),i=+d.i,wu=it.wu||0;
    if(it.done[i]){it.done[i]=null;if(a.restFrom===`${it.id}:${i}`){a.restEnd=null;a.restLeft=null;a.nextUp=null;a.restFrom=null}}
    else if(i<wu){const now=Date.now();if(!a.tStart){a.tStart=now;a.runAt=now}else if(a.paused)resumeWorkout();
      // Short rest after warm-ups: 15 s after a light one, 30 s after the heavier (75%) one. No Shortcuts timer for these.
      const ratio=(parseFloat(it.w[i])||0)/(parseFloat(it.w[wu])||1),sec=ratio>=.7?30:15;
      it.done[i]=now;a.nextUp=null;a.restWhy="warm-up";a.restLen=sec;a.restFrom=`${it.id}:${i}`;startRest(sec,false)}
    else{const now=Date.now();if(!a.tStart){a.tStart=now;a.runAt=now}else if(a.paused)resumeWorkout();
      const r=restFor(it,i);it.done[i]=now;
      // First time doing this exercise: use the first logged set to set the rest of the sets.
      if(it.calib&&it.done.slice(wu).filter(Boolean).length===1){const w=parseFloat(it.w[i])||0,rr=parseInt(it.r[i],10)||it.reps;
        if(w>0){const m=e1rm(w,rr);let changed=0;
          it.w.forEach((val,j)=>{if(j<wu||j===i||it.done[j]||!(val===""||val===it.w0||val===it.w[i]))return;
            const nw=fmtW(workW(m,parseInt(it.r[j],10)||it.reps));if(nw!==val){it.w[j]=nw;changed++}});
          it.calib=false;it.est=false;it.target=workW(m,it.reps);
          if(changed)toast(`Set the rest of your ${it.name} sets to ${fmtW(it.target)} lb based on that set`)}}
      const u=unitOf(it);
      // Superset: go straight to the next exercise that still has this round's set; rest once the round is done.
      const round=i-wu,idx=m=>(m.wu||0)+round;
      const pending=u.items.filter(m=>m!==it&&idx(m)<m.done.length&&!m.done[idx(m)]);
      const nextUp=pending.find(m=>u.items.indexOf(m)>u.items.indexOf(it))||pending[0];
      if(nextUp){a.restEnd=null;a.restLeft=null;a.restFrom=`${it.id}:${i}`;a.nextUp=`${nextUp.name}, set ${round+1}`}
      else{a.nextUp=null;a.restWhy=r.why;a.restLen=r.sec;a.restFrom=`${it.id}:${i}`;startRest(r.sec,true)}
      if(unitDone(u)){setOpen(u,false);openNextUnit(it)}}
    save();renderWorkout()},
  toggleEx:d=>{const it=woItem(d.id);setOpen(unitOf(it),!it.open);save();renderWorkout()},
  ssAsk:d=>{const it=woItem(d.id),others=S.active.items.filter(x=>x!==it&&!(it.group&&x.group===it.group));
    if(!others.length){toast("Add another exercise first, then superset them.");closeSheet();return}
    openSheet(`<h3>Superset ${esc(it.name)} with</h3><p class="meta">You'll alternate sets between them and rest after each round.</p>
      <div class="rows">${others.map(x=>`<button class="row" data-a="ssMake" data-id="${it.id}" data-v="${x.id}"><span class="grow name">${esc(x.name)}</span>${x.group?`<span class="meta">In a superset</span>`:""}</button>`).join("")}</div>
      <div class="actions"><button class="btn" data-a="closeSheet">Cancel</button></div>`)},
  ssMake:d=>{const items=S.active.items,src=woItem(d.id),tgt=woItem(d.v);
    const g=src.group||uid();src.group=g;
    items.splice(items.indexOf(tgt),1);tgt.group=g;
    const lastIdx=items.map(x=>x.group).lastIndexOf(g);items.splice(lastIdx+1,0,tgt);
    normalizeGroups();setOpen(unitOf(src),true);closeSheet();save();renderWorkout();toast(`Superset: ${src.name} + ${tgt.name}`)},
  ssBreak:d=>{const items=S.active.items,it=woItem(d.id),g=it.group;
    items.splice(items.indexOf(it),1);it.group=null;const lastIdx=items.map(x=>x.group).lastIndexOf(g);items.splice(lastIdx+1,0,it);
    normalizeGroups();closeSheet();save();renderWorkout();toast(`${it.name} removed from the superset`)},
  rate:d=>{const r=S.settings.ratings=S.settings.ratings||{};const v=+d.v;
    if(r[d.n]===v){delete r[d.n];toast(`Cleared your rating for ${d.n}`)}
    else{r[d.n]=v;toast(v>0?`You'll see ${d.n} more often`:`You'll see ${d.n} less often`)}
    save();renderWorkout()},
  clearRating:d=>{delete S.settings.ratings[d.v];save();render()},
  rpe:(d,el)=>{const s=S.sessions.find(x=>x.id===d.id);if(!s)return;s.rpe=d.v;save();
    el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));
    toast(`Marked as ${RPE[d.v].label.toLowerCase()}. Muscle recovery updated.`)},
  howTo:d=>openDetails(d.n),
  calcOpen:d=>{if(!d.id){openCalc(null,0);return}const it=woItem(d.id),wu=it.wu||0;let i=it.done.findIndex((x,j)=>j>=wu&&!x);if(i<0)i=wu;openCalc(it.name,parseFloat(it.w[i])||0)},
  calcMode:d=>{calc.mode=d.v;renderCalc(true)},
  calcBar:d=>{calc.bar=+d.v;if(!(calc.name&&/EZ-Bar/.test(calc.name)))S.settings.plates=Object.assign(plateCfg(),{bar:+d.v});save();renderCalc(true)},
  plateHave:d=>{const cfg=plateCfg(),v=+d.v,i=cfg.have.indexOf(v);i>=0?cfg.have.splice(i,1):cfg.have.push(v);S.settings.plates=cfg;save();renderCalc(true)},
  sumDone:()=>{summaryId=null;renderSummary();render()},
  pauseToggle:()=>{S.active.paused?resumeWorkout():pauseWorkout();persistNow();renderWorkout()},
  addSet:d=>{const it=woItem(d.id);it.w.push(it.w[it.w.length-1]||"");it.r.push(it.r[it.r.length-1]||String(it.reps));it.done.push(null);save();renderWorkout()},
  delSet:d=>{const it=woItem(d.id),i=+d.i,wu=it.wu||0;[it.w,it.r,it.done].forEach(a=>a.splice(i,1));if(i<wu)it.wu=wu-1;
    save();renderWorkout();toast(i<wu?`Deleted a ${it.name} warm-up`:`Deleted set ${i-wu+1} of ${it.name}`)},
  pick:d=>{const cb=pickCb;closeSheet();if(cb)cb(canonical(d.v))},
  pickM:d=>{pickM=d.v;renderPick()},
  finishAsk:()=>{const n=loggedCount();openSheet(`<h3>Finish workout?</h3><p class="meta">${n?`${n} set${n===1?"":"s"} logged.`:"No sets logged yet, so there's nothing to save."}</p>
    <div class="actions">${n?`<button class="btn primary" data-a="finishSave">Save workout</button>`:""}<button class="btn danger" data-a="finishDiscard">Discard workout</button><button class="btn" data-a="closeSheet">Keep going</button></div>`)},
  finishSave:()=>finishWorkout(true),finishDiscard:()=>finishWorkout(false),
  // Per-exercise rest, remembered for next time. Starts from the automatic rest when you first adjust it.
  exRestAdj:d=>{const r=S.settings.exRest=S.settings.exRest||{};const start=r[d.n]||Math.min(MAX_AUTO_REST,S.active?S.active.rest:S.settings.rest);
    r[d.n]=Math.min(300,Math.max(15,start+(+d.d)));save();renderWorkout()},
  exRestAuto:d=>{const r=S.settings.exRest||{};delete r[d.n];save();renderWorkout();toast(`${d.n} is back to automatic rest`)},
  restShift:d=>{const a=S.active,now=Date.now(),end=Math.max(now,a.restEnd||now)+(+d.d)*1000;a.restEnd=end<=now+1000?now+1000:end;save();tick()},
  restSkip:()=>{S.active.restEnd=null;S.active.restLeft=null;save();tick()},
  restAdj:d=>{S.active.rest=Math.min(MAX_AUTO_REST,Math.max(15,S.active.rest+(+d.d)));save();tick()},
};
const CH={
  file:async el=>{const f=el.files&&el.files[0];el.value="";if(!f)return;try{const msg=importCSV(await f.text());generate();render();toast(msg)}catch(e){toast(e.message||"That file couldn't be read.")}},
  eq:el=>{const set=new Set(S.settings.equipment);el.checked?set.add(el.dataset.v):set.delete(el.dataset.v);S.settings.equipment=EQUIP.map(e=>e[0]).filter(k=>set.has(k));generate();save()},
  shortcut:el=>{S.settings.shortcut=el.checked;save()},
  pfbw:el=>{const pf=S.settings.profile=S.settings.profile||{level:"beginner"};const v=parseFloat(el.value);if(v>=60&&v<=500){pf.bw=v;save()}},
  warmups:el=>{S.settings.warmups=el.checked;save();generate();render()},
  dynRest:el=>{S.settings.dynRest=el.checked;save();render()},
  wake:el=>{S.settings.wake=el.checked;save();el.checked?wake():unwake()},
  pex:el=>{S.ui.pEx=el.value;save();render()},
};
// Swipe left on .swipe-c to reveal Replace/Delete.
let sw=null,swOpen=null,swEat=false;
const actW=c=>c.parentElement.querySelector(".swipe-act").offsetWidth||168;
const hideAct=c=>setTimeout(()=>{if(c!==swOpen&&(!sw||sw.c!==c))c.parentElement.classList.remove("show")},240);
function closeSwipe(){if(swOpen){swOpen.style.transform="";hideAct(swOpen);swOpen.parentElement.querySelectorAll(".swipe-act button").forEach(b=>b.tabIndex=-1);swOpen=null}}
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".swipe-c");
  if(swOpen&&!e.target.closest(".swipe-act,#sheet")&&c!==swOpen){closeSwipe();swEat=true;setTimeout(()=>swEat=false,400)}
  if(!c||(e.target.closest("input,select,textarea")&&!c.classList.contains("setc")))return;
  const w=actW(c);sw={c,w,x:e.clientX,y:e.clientY,base:c===swOpen?-w:0,dx:0,mode:null,id:e.pointerId};
},true);
document.addEventListener("pointermove",e=>{
  if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.mode){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.mode=Math.abs(dx)>Math.abs(dy)*1.2?"h":"v";if(sw.mode==="h"){sw.c.classList.add("dragging");sw.c.parentElement.classList.add("show")}}
  if(sw.mode!=="h")return;sw.dx=dx;sw.c.style.transform=`translateX(${Math.min(0,Math.max(-sw.w-40,sw.base+dx))}px)`;
},true);
function endSwipe(){if(!sw)return;const s=sw;sw=null;
  if(s.mode!=="h"){if(s.c===swOpen&&s.mode===null){closeSwipe();swEat=true;setTimeout(()=>swEat=false,400)}return}
  swEat=true;setTimeout(()=>swEat=false,400);s.c.classList.remove("dragging");
  if(s.base+s.dx<-s.w/2){if(swOpen&&swOpen!==s.c)closeSwipe();s.c.style.transform=`translateX(${-s.w}px)`;
    if(document.activeElement&&s.c.contains(document.activeElement))document.activeElement.blur();swOpen=s.c;s.c.parentElement.querySelectorAll(".swipe-act button").forEach(b=>b.tabIndex=0)}
  else{s.c.style.transform="";if(swOpen===s.c)swOpen=null;hideAct(s.c)}}
document.addEventListener("pointerup",endSwipe,true);document.addEventListener("pointercancel",()=>{if(sw){sw.c.classList.remove("dragging");sw.c.style.transform=sw.base?`translateX(${-sw.w}px)`:"";const c=sw.c;sw=null;if(!c.style.transform)hideAct(c)}},true);
document.addEventListener("click",e=>{if(swEat&&!e.target.closest(".swipe-act")){e.stopPropagation();e.preventDefault();swEat=false}},true);
document.addEventListener("click",e=>{unlockAudio();const el=e.target.closest("[data-a]");if(!el||el.disabled)return;if(el.dataset.a==="scrim"&&e.target!==el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el,e)});
document.addEventListener("input",e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==="w"||k==="r"){const it=woItem(el.dataset.id),i=+el.dataset.i,old=it[k][i];it[k][i]=el.value;
    // Carry a new weight forward to later unlogged sets that still had the old weight. Reps stay as planned.
    const wu=it.wu||0,end=i<wu?wu:it[k].length;
    if(k==="w")for(let j=i+1;j<end;j++){if(it.done[j]||it[k][j]!==old)break;it[k][j]=el.value;const inp=$(`#${k}-${it.id}-${j}`);if(inp)inp.value=el.value}
    if(k==="w"&&i===wu)refreshWarmups(it);
    save()}
  else if(k==="pickq"){pickQ=el.value;renderPick()}
  else if(k==="calcw"){calc.w=parseFloat(el.value)||0;renderCalc(false)}
  else if(k==="rname"){routine().name=el.value;save()}});
document.addEventListener("change",e=>{const el=e.target,k=el.dataset&&el.dataset.ch;if(k&&CH[k])CH[k](el)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();if(e.key==="Enter"&&e.target.id==="new-rname"){const b=$(".sheet .btn.primary");if(b)b.click()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")persistNow();else{tick();wake()}});
window.addEventListener("pagehide",()=>{persistNow()});

// ---------- Screen height ----------
// In Home Screen mode the app fills the whole screen, so size it from the screen itself.
function fitHeight(){
  const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  const root=document.documentElement.style;
  if(!standalone){root.removeProperty("--app-h");return}
  const portrait=matchMedia("(orientation: portrait)").matches;
  const h=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  root.setProperty("--app-h",h+"px");
}
// The page itself should never scroll (only #scroll and the workout list do). Undo any scroll iOS applies, except while typing.
const typing=()=>document.activeElement&&document.activeElement.matches("input,textarea,select");
addEventListener("scroll",()=>{if((scrollY||scrollX)&&!typing())scrollTo(0,0)},{passive:true});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!typing()&&(scrollY||scrollX))scrollTo(0,0)},50));
fitHeight();addEventListener("resize",fitHeight);addEventListener("orientationchange",()=>setTimeout(fitHeight,200));

// ---------- Boot ----------
(async()=>{
  const loaded=await Promise.race([loadState(),new Promise(r=>setTimeout(()=>r(null),2000))]);
  S=merge(loaded);
  if(S.active&&S.active.acc===undefined)Object.assign(S.active,{tStart:S.active.start,acc:0,runAt:S.active.start,paused:false,restLeft:null});
  if(S.ui.count!==undefined){delete S.ui.count}
  // Exercises renamed in the library: move your logged sets, plans, ratings and settings to the new name.
  {const rn=n=>RENAMES[n]||n,rk=o=>{if(!o)return o;for(const[k,v]of Object.entries(RENAMES))if(k in o){o[v]=o[k];delete o[k]}return o};
   S.sessions.forEach(s=>s.sets.forEach(x=>x.ex=rn(x.ex)));S.routines.forEach(r=>r.items.forEach(x=>x.name=rn(x.name)));
   S.ui.plan.forEach(x=>x.name=rn(x.name));if(S.active)S.active.items.forEach(x=>x.name=rn(x.name));S.ui.pEx=S.ui.pEx&&rn(S.ui.pEx);
   S.settings.excluded=S.settings.excluded.map(rn);rk(S.settings.ratings);rk(S.settings.exRest)}
  if(S.active&&!S.active.items.some(it=>it.open!==undefined)){const f=S.active.items.find(it=>!itemDone(it));if(f)f.open=true}
  // Turn on equipment types added since this phone last opened the app; keep earlier choices as they were.
  const seen=new Set(S.settings.seenEquip||(loaded?ORIGINAL_EQUIP:EQUIP.map(e=>e[0])));
  for(const[k]of EQUIP)if(!seen.has(k)&&!S.settings.equipment.includes(k))S.settings.equipment.push(k);
  S.settings.seenEquip=EQUIP.map(e=>e[0]);
  if(!S.ui.plan.length)generate();
  render();setInterval(tick,500);wake();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
</script>
